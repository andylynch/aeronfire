[versions]
# Keep Aeron, SBE and Artio in step: each Artio release is built against one Aeron version.
aeron = "1.53.3"
sbe = "1.41.0"
# Artio 0.186 is built against Aeron 1.53.3 / Agrona 2.6.1.
artio = "0.186"
hdrhistogram = "2.2.2"
junit = "6.1.3"

[libraries]
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
aeron-driver = { module = "io.aeron:aeron-driver", version.ref = "aeron" }
aeron-archive = { module = "io.aeron:aeron-archive", version.ref = "aeron" }
aeron-cluster = { module = "io.aeron:aeron-cluster", version.ref = "aeron" }
aeron-samples = { module = "io.aeron:aeron-samples", version.ref = "aeron" }
sbe-tool = { module = "uk.co.real-logic:sbe-tool", version.ref = "sbe" }
artio-codecs = { module = "uk.co.real-logic:artio-codecs", version.ref = "artio" }
artio-core = { module = "uk.co.real-logic:artio-core", version.ref = "artio" }
artio-session-codecs = { module = "uk.co.real-logic:artio-session-codecs", version.ref = "artio" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

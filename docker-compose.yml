# Three cluster members, the FIX gateway, and on-demand venue and load clients.
#   docker compose up -d --build             # cluster + gateway + web blotter (http://localhost:8080)
#   docker compose run --rm venue            # Tradeweb-style venue over FIX
#   docker compose run --rm tui              # terminal blotter
#   control plane: http://localhost:8090 (users root/risk/ops/deskhead/compliance/sales, password = name)
#   Jolokia (no auth) on every JVM: control :8778, posttrade :8779, node0-2 :8780-8782,
#                  gateway :8783, monitor :8784, refdata :8785, tui :8786, venue :8787, client :8788
#                  (run-only services publish theirs with docker compose run --service-ports)
#   docker compose run --rm client           # raw cluster load test (no FIX)
#   docker compose kill <leader>             # watch a new leader take over
x-node: &node
  build: .
  image: aeronfire:local
  shm_size: 1g
  environment: &node-env
    CLUSTER_HOSTS: node0,node1,node2
    PORT_BASE: "9000"
    CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
  restart: "no"

services:
  node0:
    <<: *node
    hostname: node0
    environment:
      <<: *node-env
      NODE_ID: "0"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8780,host=0.0.0.0
    ports:
      - "8780:8780"

  node1:
    <<: *node
    hostname: node1
    environment:
      <<: *node-env
      NODE_ID: "1"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8781,host=0.0.0.0
    ports:
      - "8781:8781"

  node2:
    <<: *node
    hostname: node2
    environment:
      <<: *node-env
      NODE_ID: "2"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8782,host=0.0.0.0
    ports:
      - "8782:8782"

  gateway:
    image: aeronfire:local
    hostname: gateway
    shm_size: 1g
    entrypoint: ["/app/bin/fix-gateway"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: gateway
      FIX_PORT: "9880"
      WORK_DIR: /tmp
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8783,host=0.0.0.0
    ports:
      - "9880:9880"
      - "8783:8783"
    depends_on: [node0, node1, node2]

  monitor:
    image: aeronfire:local
    hostname: monitor
    shm_size: 512m
    entrypoint: ["/app/bin/monitor"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: monitor
      UI: web
      HTTP_PORT: "8080"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8784,host=0.0.0.0
    ports:
      - "8080:8080"
      - "8784:8784"
    depends_on: [node0, node1, node2]

  control:
    image: aeronfire:local
    hostname: control
    shm_size: 512m
    entrypoint: ["/app/bin/control"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: control
      CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
      ADMIN_HTTP_PORT: "8090"
      # Jolokia: JMX as JSON over HTTP, e.g. curl localhost:8778/jolokia/read/aeronfire:type=Credit
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8778,host=0.0.0.0
    ports:
      - "8090:8090"
      - "8778:8778"
    depends_on: [node0, node1, node2]

  refdata:
    image: aeronfire:local
    hostname: refdata
    entrypoint: ["/app/bin/refdata"]
    environment:
      # snapshot (default, offline) or live (GLEIF, UK Sanctions List, FCA FIRDS; falls back per source)
      REFDATA_MODE: ${REFDATA_MODE:-snapshot}
      CONTROL_URL: http://control:8090
      REFDATA_HTTP_PORT: "8095"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8785,host=0.0.0.0
    ports:
      - "8095:8095"
      - "8785:8785"
    depends_on: [control]

  posttrade:
    image: aeronfire:local
    hostname: posttrade
    shm_size: 512m
    entrypoint: ["/app/bin/posttrade"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: posttrade
      REFDATA_URL: http://refdata:8095
      DATA_DIR: /data
      POSTTRADE_HTTP_PORT: "8096"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8779,host=0.0.0.0
    volumes:
      - posttrade-data:/data
    ports:
      - "8096:8096"
      - "8779:8779"
    depends_on: [node0, node1, node2, refdata]

  tui:
    image: aeronfire:local
    profiles: [tui]
    hostname: tui
    shm_size: 512m
    tty: true
    stdin_open: true
    entrypoint: ["/app/bin/monitor"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: tui
      UI: tui
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8786,host=0.0.0.0
    ports:
      - "8786:8786"
    depends_on: [node0, node1, node2]

  venue:
    image: aeronfire:local
    profiles: [venue]
    hostname: venue
    shm_size: 512m
    entrypoint: ["/app/bin/venue-sim"]
    environment:
      GATEWAY_HOST: gateway
      FIX_PORT: "9880"
      RFQ_RATE: "50"
      DURATION_SECONDS: "60"
      WORK_DIR: /tmp
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8787,host=0.0.0.0
    ports:
      - "8787:8787"
    depends_on: [gateway]

  client:
    image: aeronfire:local
    profiles: [client]
    hostname: client
    shm_size: 512m
    entrypoint: ["/app/bin/rfq-client"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: client
      CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
      RFQ_COUNT: "20000"
      WARMUP_COUNT: "5000"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8788,host=0.0.0.0
    ports:
      - "8788:8788"
    depends_on: [node0, node1, node2]

volumes:
  posttrade-data:

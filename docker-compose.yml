# Three cluster members, the FIX gateway, and on-demand venue and load clients.
#   docker compose up -d --build             # cluster + gateway
#   docker compose run --rm venue            # Tradeweb-style venue over FIX
#   docker compose run --rm client           # raw cluster load test (no FIX)
#   docker compose kill <leader>             # watch a new leader take over
x-node: &node
  build: .
  image: aeronfire:local
  shm_size: 1g
  environment: &node-env
    CLUSTER_HOSTS: node0,node1,node2
    PORT_BASE: "9000"
  restart: "no"

services:
  node0:
    <<: *node
    hostname: node0
    environment:
      <<: *node-env
      NODE_ID: "0"

  node1:
    <<: *node
    hostname: node1
    environment:
      <<: *node-env
      NODE_ID: "1"

  node2:
    <<: *node
    hostname: node2
    environment:
      <<: *node-env
      NODE_ID: "2"

  gateway:
    image: aeronfire:local
    hostname: gateway
    shm_size: 1g
    entrypoint: ["/app/bin/fix-gateway"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: gateway
      FIX_PORT: "9880"
      WORK_DIR: /tmp
    ports:
      - "9880:9880"
    depends_on: [node0, node1, node2]

  venue:
    image: aeronfire:local
    profiles: [venue]
    hostname: venue
    shm_size: 512m
    entrypoint: ["/app/bin/venue-sim"]
    environment:
      GATEWAY_HOST: gateway
      FIX_PORT: "9880"
      RFQ_RATE: "50"
      DURATION_SECONDS: "60"
      WORK_DIR: /tmp
    depends_on: [gateway]

  client:
    image: aeronfire:local
    profiles: [client]
    hostname: client
    shm_size: 512m
    entrypoint: ["/app/bin/rfq-client"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: client
      RFQ_COUNT: "20000"
      WARMUP_COUNT: "5000"
    depends_on: [node0, node1, node2]

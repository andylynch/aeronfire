# Three cluster members, the FIX gateway, and on-demand venue and load clients.
#   docker compose up -d --build             # cluster + gateway + web blotter (http://localhost:8080)
#   docker compose run --rm venue            # Tradeweb-style venue over FIX
#   docker compose run --rm tui              # terminal blotter
#   control plane: http://localhost:8090 (users root/risk/ops/deskhead/compliance/sales, password = name)
#                  Jolokia on :8778
#   docker compose run --rm client           # raw cluster load test (no FIX)
#   docker compose kill <leader>             # watch a new leader take over
#   docker compose --profile demo up -d      # + live venue and the demo panel (http://localhost:8100, user demo)
#                                            #   set DEMO_PASSWORD; see README "Demo panel" before exposing it
x-node: &node
  build: .
  image: aeronfire:local
  shm_size: 1g
  cap_add: [NET_ADMIN]   # lets the demo panel add delay and loss to a member's network with tc
  environment: &node-env
    CLUSTER_HOSTS: node0,node1,node2
    PORT_BASE: "9000"
    CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
  restart: "no"

services:
  node0:
    <<: *node
    hostname: node0
    environment:
      <<: *node-env
      NODE_ID: "0"

  node1:
    <<: *node
    hostname: node1
    environment:
      <<: *node-env
      NODE_ID: "1"

  node2:
    <<: *node
    hostname: node2
    environment:
      <<: *node-env
      NODE_ID: "2"

  gateway:
    image: aeronfire:local
    hostname: gateway
    shm_size: 1g
    entrypoint: ["/app/bin/fix-gateway"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: gateway
      FIX_PORT: "9880"
      WORK_DIR: /tmp
    ports:
      - "9880:9880"
    depends_on: [node0, node1, node2]

  monitor:
    image: aeronfire:local
    hostname: monitor
    shm_size: 512m
    entrypoint: ["/app/bin/monitor"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: monitor
      UI: web
      HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on: [node0, node1, node2]

  control:
    image: aeronfire:local
    hostname: control
    shm_size: 512m
    entrypoint: ["/app/bin/control"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: control
      CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
      ADMIN_HTTP_PORT: "8090"
      # Jolokia: JMX as JSON over HTTP, e.g. curl -u jolokia:jolokia localhost:8778/jolokia/read/aeronfire:type=Credit
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8778,host=0.0.0.0,user=jolokia,password=jolokia
    ports:
      - "8090:8090"
      - "8778:8778"
    depends_on: [node0, node1, node2]

  refdata:
    image: aeronfire:local
    hostname: refdata
    entrypoint: ["/app/bin/refdata"]
    environment:
      # snapshot (default, offline) or live (GLEIF, UK Sanctions List, FCA FIRDS; falls back per source)
      REFDATA_MODE: ${REFDATA_MODE:-snapshot}
      CONTROL_URL: http://control:8090
      REFDATA_HTTP_PORT: "8095"
    ports:
      - "8095:8095"
    depends_on: [control]

  posttrade:
    image: aeronfire:local
    hostname: posttrade
    shm_size: 512m
    entrypoint: ["/app/bin/posttrade"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: posttrade
      REFDATA_URL: http://refdata:8095
      DATA_DIR: /data
      POSTTRADE_HTTP_PORT: "8096"
      JAVA_OPTS: -javaagent:/app/agent/jolokia-agent.jar=port=8779,host=0.0.0.0,user=jolokia,password=jolokia
    volumes:
      - posttrade-data:/data
    ports:
      - "8096:8096"
      - "8779:8779"
    depends_on: [node0, node1, node2, refdata]

  # ---- demo profile: always-on venue and the demo panel ---------------------------------------------------
  venue-live:
    image: aeronfire:local
    profiles: [demo]
    hostname: venue-live
    shm_size: 512m
    entrypoint: ["/app/bin/venue-sim"]
    restart: unless-stopped
    environment:
      GATEWAY_HOST: gateway
      FIX_PORT: "9880"
      RFQ_RATE: ${DEMO_DEFAULT_RPS:-20}
      DURATION_SECONDS: "0"
      VENUE_CONTROL_PORT: "8099"      # the panel changes the rate and reads latency here; never publish it
      VENUE_MAX_RATE: ${DEMO_MAX_RPS:-200}
      WORK_DIR: /tmp
    depends_on: [gateway]

  demo:
    # No hostname on purpose: the panel finds its own compose project from its container id (the default hostname).
    image: aeronfire:local
    profiles: [demo]
    shm_size: 64m
    entrypoint: ["/app/bin/demo"]
    restart: unless-stopped
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}          # blank: a random one is generated and printed in `docker compose logs demo`
      MONITOR_URL: http://monitor:8080
      VENUE_URL: http://venue-live:8099
      CONTROL_URL: http://control:8090
      CONTROL_USERS: ${CONTROL_USERS:-}
      DEMO_BLOTTER_URL: ${DEMO_BLOTTER_URL:-}
      DEMO_DEFAULT_RPS: ${DEMO_DEFAULT_RPS:-20}
      DEMO_MAX_RPS: ${DEMO_MAX_RPS:-200}
      DEMO_AUTO_HEAL_S: ${DEMO_AUTO_HEAL_S:-60}      # 0 turns off; for a presenter who wants a long outage
      DEMO_AUTO_REVERT_S: ${DEMO_AUTO_REVERT_S:-120}
    volumes:
      # Full control of the Docker host to anything that gets code execution in this container. See README.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8100:8100"
    depends_on: [monitor, control, venue-live]

  tui:
    image: aeronfire:local
    profiles: [tui]
    hostname: tui
    shm_size: 512m
    tty: true
    stdin_open: true
    entrypoint: ["/app/bin/monitor"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: tui
      UI: tui
    depends_on: [node0, node1, node2]

  venue:
    image: aeronfire:local
    profiles: [venue]
    hostname: venue
    shm_size: 512m
    entrypoint: ["/app/bin/venue-sim"]
    environment:
      GATEWAY_HOST: gateway
      FIX_PORT: "9880"
      RFQ_RATE: "50"
      DURATION_SECONDS: "60"
      WORK_DIR: /tmp
    depends_on: [gateway]

  client:
    image: aeronfire:local
    profiles: [client]
    hostname: client
    shm_size: 512m
    entrypoint: ["/app/bin/rfq-client"]
    environment:
      CLUSTER_HOSTS: node0,node1,node2
      PORT_BASE: "9000"
      EGRESS_HOST: client
      CONTROL_SECRET: ${CONTROL_SECRET:-dev-control-secret}
      RFQ_COUNT: "20000"
      WARMUP_COUNT: "5000"
    depends_on: [node0, node1, node2]

volumes:
  posttrade-data:

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log
        shell: bash -o pipefail {0}
      - name: Failover test (kill the leader mid-flow)
        run: ./gradlew failoverTest --no-daemon --console=plain 2>&1 | tee -a build.log
        shell: bash -o pipefail {0}
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|What went wrong|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
